<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>통합 관리자 페이지</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: auto;
      }
      .admin-section {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
      }
      .admin-section h1 {
        margin-top: 0;
      }
      div {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      input[type="date"] {
        padding: 8px;
      }

      button {
        padding: 10px 15px;
        border: none;
        cursor: pointer;
        border-radius: 4px;
      }
      .btn-submit {
        background-color: #007bff;
        color: white;
      }
      .btn-submit:hover {
        background-color: #0056b3;
      }
      .btn-cancel {
        background-color: #6c757d;
        color: white;
        margin-left: 10px;
      }
      .btn-cancel:hover {
        background-color: #5a6268;
      }

      /* --- (추가) v4: 푸시 알림 체크박스 --- */
      .form-check {
        display: flex;
        align-items: center;
      }
      .form-check input {
        width: auto;
        margin-right: 10px;
      }
      .form-check label {
        margin-bottom: 0;
        font-weight: normal;
      }
      /* ---------------------------------- */

      #notice-message,
      #current-notice-message {
        margin-top: 15px;
        font-weight: bold;
      }
      .notice-list {
        margin-top: 20px;
        border-top: 1px solid #eee;
      }
      .notice-item {
        padding: 15px;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .notice-item div {
        flex: 1;
        margin: 0;
      }
      .notice-item strong {
        font-size: 1.1em;
      }

      .item-buttons {
        white-space: nowrap;
        margin-left: 10px;
      }
      .edit-btn {
        background-color: #28a745;
        color: white;
        padding: 5px 10px;
        font-size: 0.9em;
        margin-right: 5px;
      }
      .edit-btn:hover {
        background-color: #218838;
      }
      .delete-btn {
        background-color: #dc3545;
        color: white;
        padding: 5px 10px;
        font-size: 0.9em;
      }
      .delete-btn:hover {
        background-color: #c82333;
      }
    </style>
  </head>
  <body>
    <div class="admin-section" id="notice-manager">
      <h1>공지사항 관리</h1>
      <form id="notice-form">
        <input type="hidden" id="notice-id" />

        <div>
          <label for="date">날짜 (Date)</label>
          <input type="date" id="date" required />
        </div>
        <div>
          <label for="title">제목 (Title)</label>
          <input type="text" id="title" required />
        </div>
        <div>
          <label for="content">내용 (Content)</label>
          <textarea id="content" rows="5" required></textarea>
        </div>

        <div class="form-check">
          <input type="checkbox" id="send-push" />
          <label for="send-push">📢 유저에게 푸시 알림 보내기</label>
        </div>
        <div>
          <button type="submit" class="btn-submit" id="submit-btn">
            공지사항 저장
          </button>
          <button
            type="button"
            class="btn-cancel"
            id="cancel-btn"
            style="display: none"
          >
            수정 취소
          </button>
        </div>
      </form>
      <div id="notice-message"></div>

      <hr style="margin-top: 30px" />
      <h2>현재 공지 목록</h2>
      <div id="current-notice-message"></div>
      <div id="notice-list-container"></div>
    </div>

    <script>
      const noticeForm = document.getElementById("notice-form");
      const noticeMessage = document.getElementById("notice-message");
      const listContainer = document.getElementById("notice-list-container");
      const currentNoticeMessage = document.getElementById(
        "current-notice-message"
      );

      const noticeIdInput = document.getElementById("notice-id");
      const dateInput = document.getElementById("date");
      const titleInput = document.getElementById("title");
      const contentInput = document.getElementById("content");
      const submitBtn = document.getElementById("submit-btn");
      const cancelBtn = document.getElementById("cancel-btn");
      const sendPushInput = document.getElementById("send-push"); // (추가) v4

      let allNotices = [];

      function resetForm() {
        noticeIdInput.value = "";
        noticeForm.reset();
        dateInput.valueAsDate = new Date();
        submitBtn.textContent = "공지사항 저장";
        cancelBtn.style.display = "none";
        noticeMessage.textContent = "";
        sendPushInput.checked = false; // (추가) v4: 체크박스 초기화
      }

      // 1. [저장/수정] 폼 제출(POST / PUT) 이벤트
      noticeForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const title = titleInput.value;
        const content = contentInput.value;
        const date = dateInput.value;
        const idToUpdate = noticeIdInput.value;
        const sendPush = sendPushInput.checked; // (추가) v4: 체크박스 값

        let method, url, body, successMessage;

        if (idToUpdate) {
          // (수정) ID가 있으면 '수정' (PUT)
          method = "PUT";
          url = "/api/notices";
          body = JSON.stringify({
            id: idToUpdate,
            title: title,
            content: content,
            date: date,
            sendPush: sendPush, // (추가) v4
          });
          successMessage = "✅ 공지사항이 성공적으로 수정되었습니다!";
          noticeMessage.textContent = "수정 중...";
        } else {
          // ID가 없으면 '신규' (POST)
          method = "POST";
          url = "/api/notices";
          body = JSON.stringify({
            title,
            content,
            date,
            sendPush: sendPush, // (추가) v4
          });
          successMessage = "✅ 공지사항이 성공적으로 저장되었습니다!";
          noticeMessage.textContent = "저장 중...";
        }

        try {
          const res = await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: body,
          });

          const result = await res.json(); // (수정) v4: 응답을 먼저 파싱

          if (res.ok && result.success) {
            noticeMessage.textContent = successMessage;
            noticeMessage.style.color = "green";

            // (추가) v4: 푸시 알림 결과 표시
            if (result.push) {
              noticeMessage.textContent += ` (푸시: ${result.push.sent}명 전송, ${result.push.failed}명 실패)`;
            }

            resetForm();
            loadNotices();
          } else {
            throw new Error(result.error || "작업 실패");
          }
        } catch (error) {
          console.error("Error:", error);
          noticeMessage.textContent = "❌ 작업 실패: " + error.message;
          noticeMessage.style.color = "red";
        }
      });

      // 2. [조회] 공지 목록 불러오기 (GET)
      async function loadNotices() {
        listContainer.innerHTML = "목록을 불러오는 중...";
        currentNoticeMessage.textContent = "";
        try {
          const res = await fetch("/api/notices");
          if (!res.ok) throw new Error("목록 로딩 실패");

          allNotices = await res.json();

          if (allNotices.length === 0) {
            listContainer.innerHTML = "<p>등록된 공지사항이 없습니다.</p>";
            return;
          }

          listContainer.innerHTML = allNotices
            .map(
              (item) => `
                    <div class="notice-item" id="item-${item.id}">
                        <div>
                            <strong>${item.title}</strong> (${item.date})<br>
                            <small>${item.content.substring(0, 100)}...</small>
                        </div>
                        <div class="item-buttons">
                            <button class="edit-btn" data-id="${
                              item.id
                            }">수정</button>
                            <button class="delete-btn" data-id="${
                              item.id
                            }">삭제</button>
                        </div>
                    </div>
                `
            )
            .join("");
        } catch (error) {
          listContainer.innerHTML = `<p style="color: red;">${error.message}</p>`;
        }
      }

      // 3. [삭제/수정] 목록 버튼 클릭 이벤트 (이하 v3.1과 동일)
      listContainer.addEventListener("click", async function (e) {
        const target = e.target;
        if (target.classList.contains("delete-btn")) {
          const idToDelete = target.dataset.id;
          if (!confirm(`[${idToDelete}] 공지를 정말 삭제하시겠습니까?`)) return;

          currentNoticeMessage.textContent = "삭제 중...";
          try {
            const res = await fetch("/api/notices", {
              method: "DELETE",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: idToDelete }),
            });
            if (res.ok) {
              currentNoticeMessage.textContent = "✅ 삭제되었습니다.";
              currentNoticeMessage.style.color = "green";
              loadNotices();
            } else {
              throw new Error((await res.json()).error || "삭제 실패");
            }
          } catch (error) {
            currentNoticeMessage.textContent = `❌ ${error.message}`;
            currentNoticeMessage.style.color = "red";
          }
        }
        if (target.classList.contains("edit-btn")) {
          const idToEdit = target.dataset.id;
          const noticeToEdit = allNotices.find((item) => item.id === idToEdit);
          if (!noticeToEdit) return;
          noticeIdInput.value = noticeToEdit.id;
          dateInput.value = noticeToEdit.date;
          titleInput.value = noticeToEdit.title;
          contentInput.value = noticeToEdit.content;
          submitBtn.textContent = "수정 완료";
          cancelBtn.style.display = "inline-block";
          window.scrollTo(0, 0);
        }
      });

      // 4. [수정 취소] 버튼 클릭 이벤트
      cancelBtn.addEventListener("click", function () {
        resetForm();
      });

      // 5. 페이지 로드 시 목록 자동 불러오기
      document.addEventListener("DOMContentLoaded", () => {
        resetForm();
        loadNotices();
      });
    </script>
  </body>
</html>
