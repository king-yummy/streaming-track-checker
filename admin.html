<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>통합 관리자 페이지</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 800px;
        margin: auto;
      }
      .admin-section {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
      }
      .admin-section h1 {
        margin-top: 0;
      }
      div {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      textarea {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      input[type="date"] {
        padding: 8px;
      }
      button {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      #message {
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="admin-section" id="notice-manager">
      <h1>공지사항 관리</h1>
      <form id="notice-form">
        <div>
          <label for="date">날짜 (Date)</label>
          <input type="date" id="date" required />
        </div>
        <div>
          <label for="title">제목 (Title)</label>
          <input type="text" id="title" required />
        </div>
        <div>
          <label for="content">내용 (Content)</label>
          <textarea id="content" rows="5" required></textarea>
        </div>
        <button type="submit">공지사항 저장</button>
      </form>
      <div id="notice-message"></div>
    </div>

    <script>
      // --- 공지사항 관리 스크립트 ---

      // 1. 오늘 날짜 기본 설정
      document.getElementById("date").valueAsDate = new Date();

      // 2. 폼 제출(저장) 이벤트
      document
        .getElementById("notice-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const title = document.getElementById("title").value;
          const content = document.getElementById("content").value;
          const date = document.getElementById("date").value;

          const messageDiv = document.getElementById("notice-message");
          messageDiv.textContent = "저장 중...";

          try {
            // 1단계에서 만든 API(/api/notices) 호출
            const res = await fetch("/api/notices", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                title: title,
                content: content,
                date: date,
              }),
            });

            if (res.ok) {
              messageDiv.textContent =
                "✅ 공지사항이 성공적으로 저장되었습니다!";
              messageDiv.style.color = "green";
              document.getElementById("title").value = "";
              document.getElementById("content").value = "";
            } else {
              const errorData = await res.json();
              throw new Error(errorData.error || "저장 실패");
            }
          } catch (error) {
            console.error("Error:", error);
            messageDiv.textContent = "❌ 저장 실패: " + error.message;
            messageDiv.style.color = "red";
          }
        });
    </script>
  </body>
</html>
