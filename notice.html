<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지사항 - PLLI 스밍/투표 체크</title>

    <link rel="stylesheet" href="css/style.css" />

      </p>
      <button
        id="back-button"

        메인으로 돌아가기
      </button>

    <script>
      document.getElementById("back-button").addEventListener("click", () => {
