<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지 & 캘린더 - PLLI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9063401338616510"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <style>
      .toggle-checkbox:checked {
        right: 0;
        border-color: #3b82f6;
      }
      .toggle-checkbox:checked + .toggle-label {
        background-color: #3b82f6;
      }
    </style>
  </head>
  <body class="font-sans bg-gray-50">
    <header class="w-full bg-white shadow-sm sticky top-0 z-10">
      <div
        class="max-w-xl mx-auto p-4 relative flex justify-center items-center"
      >
        <a
          href="index.html"
          class="absolute left-4 text-gray-600 hover:text-gray-800"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </a>
        <h2 class="text-xl font-bold">📢 공지 & 캘린더</h2>
      </div>
    </header>

    <main class="w-full max-w-xl mx-auto p-4 bg-white min-h-screen">
      <section id="notification-section" class="mb-6 bg-blue-50 p-4 rounded-lg">
        <div class="flex justify-between items-center">
          <div>
            <h3 class="font-bold text-gray-800">전체 알림 받기</h3>
            <p class="text-xs text-gray-600 mt-1">
              새 공지사항, 15분 전 일정 알림을 모두 받습니다.
            </p>
          </div>
          <div
            class="relative inline-block w-10 align-middle select-none transition duration-200 ease-in"
          >
            <input
              type="checkbox"
              name="alarm-toggle"
              id="alarm-toggle"
              class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"
            />
            <label
              for="alarm-toggle"
              class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"
            ></label>
          </div>
        </div>
      </section>

      <section id="notice-section" class="mb-8">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold">📢 공지사항</h3>
        </div>
        <div id="notice-list-container" class="space-y-3"></div>
        <div
          id="notice-pagination-container"
          class="flex justify-center items-center mt-6 space-x-2"
        ></div>
      </section>

      <section
        id="ad-container-1"
        class="my-4 p-4 bg-white rounded-2xl shadow"
        style="
          visibility: hidden;
          min-height: 120px;
          max-height: 160px;
          display: flex;
          flex-direction: column;
          justify-content: center;
        "
      >
        <h3 class="text-sm font-bold text-gray-400 mb-2 px-2">
          ✨ PLLI를 위한 추천 (서버비에 한 스푼..)
        </h3>
        <div style="text-align: center">
          <ins
            class="adsbygoogle"
            style="display: block"
            data-ad-client="ca-pub-9063401338616510"
            data-ad-slot="3718792037"
            data-ad-format="auto"
            data-full-width-responsive="true"
          ></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
        </div>
      </section>

      <section id="calendar-section">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold">🗓️ 공유 캘린더</h3>
        </div>
        <div id="calendar"></div>
      </section>

      <section
        id="ad-container-2"
        class="my-4 p-4 bg-white rounded-2xl shadow"
        style="
          visibility: hidden;
          min-height: 120px;
          max-height: 160px;
          display: flex;
          flex-direction: column;
          justify-content: center;
        "
      >
        <h3 class="text-sm font-bold text-gray-400 mb-2 px-2">
          ✨ PLLI를 위한 추천 (서버비에 한 스푼..)
        </h3>
        <div style="text-align: center">
          <ins
            class="adsbygoogle"
            style="display: block"
            data-ad-client="ca-pub-9063401338616510"
            data-ad-slot="3718792037"
            data-ad-format="auto"
            data-full-width-responsive="true"
          ></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
        </div>
      </section>
    </main>

    <div
      id="date-picker-modal-overlay"
      class="fixed inset-0 bg-black bg-opacity-50 z-[120] hidden"
    ></div>
    <div
      id="date-picker-modal-panel"
      class="fixed bottom-0 inset-x-0 z-[130] bg-white rounded-t-2xl p-6 shadow-xl transform transition-transform translate-y-full"
      style="transition: transform 0.3s ease-in-out"
    >
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">날짜 선택</h3>
        <button
          id="close-date-picker-btn"
          class="text-gray-400 hover:text-gray-700 text-2xl"
        >
          &times;
        </button>
      </div>
      <div class="flex gap-4 mb-6">
        <select
          id="year-select"
          class="w-full p-3 border border-gray-300 rounded-md bg-white text-center text-lg"
        ></select>
        <select
          id="month-select"
          class="w-full p-3 border border-gray-300 rounded-md bg-white text-center text-lg"
        ></select>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <button
          id="cancel-date-btn"
          class="w-full py-3 rounded-md bg-gray-200 text-gray-800 font-semibold"
        >
          취소
        </button>
        <button
          id="confirm-date-btn"
          class="w-full py-3 rounded-md bg-blue-500 text-white font-semibold"
        >
          확인
        </button>
      </div>
    </div>

    <div
      id="edit-modal-overlay"
      class="fixed inset-0 bg-black bg-opacity-50 z-[110] hidden"
    ></div>
    <div
      id="edit-modal-panel"
      class="fixed inset-0 z-[120] p-4 flex items-center justify-center hidden"
    >
      <div
        class="w-full max-w-sm bg-white rounded-2xl shadow-xl transform transition-all"
      >
        <div class="p-5">
          <div class="flex justify-between items-center mb-4">
            <h3 id="edit-modal-title" class="text-lg font-bold">
              새 일정 추가
            </h3>
            <button
              id="close-edit-modal-btn"
              class="text-gray-400 hover:text-gray-700 text-2xl"
            >
              &times;
            </button>
          </div>
          <div class="space-y-4">
            <div>
              <label
                for="modal-event-title"
                class="block text-sm font-medium text-gray-700 mb-1"
                >내용</label
              >
              <input
                type="text"
                id="modal-event-title"
                placeholder="일정 내용을 입력하세요"
                class="w-full p-2 border border-gray-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >시작일시</label
              >
              <div class="flex items-center gap-2">
                <input
                  type="date"
                  id="modal-event-date"
                  class="flex-grow p-2 border border-gray-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                />
                <select
                  id="modal-event-ampm"
                  class="p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                ></select>
                <select
                  id="modal-event-hour"
                  class="p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                ></select>
                <select
                  id="modal-event-minute"
                  class="p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                ></select>
              </div>
            </div>

            <div id="end-time-container" class="hidden space-y-2 pt-2 border-t">
              <label class="block text-sm font-medium text-gray-700"
                >종료일시</label
              >
              <div class="flex items-center gap-2">
                <input
                  type="date"
                  id="modal-end-date"
                  class="flex-grow p-2 border border-gray-300 rounded-md text-sm focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                />
                <select
                  id="modal-end-ampm"
                  class="p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                ></select>
                <select
                  id="modal-end-hour"
                  class="p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                ></select>
                <select
                  id="modal-end-minute"
                  class="p-2 border border-gray-300 rounded-md text-sm bg-white focus:ring-1 focus:ring-blue-500 focus:border-blue-500"
                ></select>
              </div>
            </div>

            <button
              id="add-end-time-btn"
              class="w-full text-sm text-blue-600 hover:underline py-1"
            >
              + 종료일시 추가
            </button>

            <div class="flex justify-end space-x-2 pt-3">
              <button
                id="cancel-edit-btn"
                class="py-2 px-4 rounded-md bg-gray-200 text-gray-800 text-sm font-semibold hover:bg-gray-300"
              >
                취소
              </button>
              <button
                id="save-event-btn"
                class="py-2 px-4 rounded-md bg-blue-500 text-white text-sm font-semibold hover:bg-blue-600"
              >
                저장
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div
      id="daily-events-modal-overlay"
      class="fixed inset-0 bg-black bg-opacity-50 z-[110] hidden"
    ></div>
    <div
      id="daily-events-modal-panel"
      class="fixed inset-0 z-[120] p-4 flex items-center justify-center hidden"
    >
      <div
        class="w-full max-w-sm bg-white rounded-2xl shadow-xl transform transition-all h-[50vh] flex flex-col"
      >
        <div class="p-5 flex-grow flex flex-col min-h-0">
          <div class="flex-shrink-0 flex justify-between items-center mb-4">
            <h3 id="daily-events-modal-title" class="text-lg font-bold"></h3>
            <button
              id="close-daily-events-modal-btn"
              class="text-gray-400 hover:text-gray-700 text-2xl"
            >
              &times;
            </button>
          </div>
          <div
            id="daily-events-list"
            class="space-y-2 flex-grow overflow-y-auto"
          ></div>
        </div>
      </div>
    </div>
    <script type="module" src="js/main.js"></script>
    <script src="js/calendar.js"></script>

    <script>
      function revealAdWhenFilled(containerId) {
        const box = document.getElementById(containerId);
        if (!box) return;
        const tick = setInterval(() => {
          const filled = box.querySelector("ins.adsbygoogle iframe");
          if (filled) {
            box.style.visibility = "visible";
            clearInterval(tick);
          }
        }, 300);
        setTimeout(() => clearInterval(tick), 10000);
      }
      document.addEventListener("DOMContentLoaded", () => {
        revealAdWhenFilled("ad-container-1");
        revealAdWhenFilled("ad-container-2");
      });
    </script>
  </body>
</html>
