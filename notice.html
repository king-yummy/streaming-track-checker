<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공지 & 캘린더 - PLLI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <style>
      /* 토글 스위치 스타일 */
      .toggle-checkbox:checked {
        right: 0;
        border-color: #3b82f6; /* blue-500 */
      }
      .toggle-checkbox:checked + .toggle-label {
        background-color: #3b82f6; /* blue-500 */
      }
    </style>
  </head>
  <body class="font-sans bg-gray-50">
    <header class="w-full bg-white shadow-sm sticky top-0 z-10">
      <div
        class="max-w-xl mx-auto p-4 relative flex justify-center items-center"
      >
        <a
          href="index.html"
          class="absolute left-4 text-gray-600 hover:text-gray-800"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            /></svg
        ></a>
        <h2 class="text-xl font-bold">📢 공지 & 캘린더</h2>
      </div>
    </header>

    <main class="w-full max-w-xl mx-auto p-4 bg-white min-h-screen">
      <section id="notice-section" class="mb-8">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold">📢 공지사항</h3>
          <div class="flex items-center">
            <span class="text-sm mr-2 text-gray-600">알림</span>
            <div
              class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in"
            >
              <input
                type="checkbox"
                name="notice-toggle"
                id="notice-toggle"
                class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"
              />
              <label
                for="notice-toggle"
                class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"
              ></label>
            </div>
          </div>
        </div>
        <div id="notice-list-container" class="space-y-3"></div>
        <div
          id="notice-pagination-container"
          class="flex justify-center items-center mt-6 space-x-2"
        ></div>
      </section>

      <hr class="my-6" />

      <section id="calendar-section">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-bold">🗓️ 공유 캘린더</h3>
          <div class="flex items-center">
            <span class="text-sm mr-2 text-gray-600">알림</span>
            <div
              class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in"
            >
              <input
                type="checkbox"
                name="calendar-toggle"
                id="calendar-toggle"
                class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"
              />
              <label
                for="calendar-toggle"
                class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"
              ></label>
            </div>
          </div>
        </div>
        <div id="calendar"></div>
      </section>
    </main>

    <div
      id="edit-modal-overlay"
      class="fixed inset-0 bg-black bg-opacity-50 z-[110] hidden"
    ></div>
    <div
      id="edit-modal-panel"
      class="fixed inset-0 z-[120] p-4 flex items-center justify-center hidden"
    >
      <div
        class="w-full max-w-sm bg-white rounded-2xl shadow-xl transform transition-all"
      >
        <div class="p-5">
          <div class="flex justify-between items-center mb-4">
            <h3 id="edit-modal-title" class="text-lg font-bold">
              새 일정 추가
            </h3>
            <button
              id="close-edit-modal-btn"
              class="text-gray-400 hover:text-gray-700 text-2xl"
            >
              &times;
            </button>
          </div>
          <div class="space-y-3">
            <div>
              <label
                for="modal-event-title"
                class="block text-sm font-medium text-gray-700 mb-1"
                >내용</label
              >
              <input
                type="text"
                id="modal-event-title"
                placeholder="일정 내용을 입력하세요"
                class="w-full p-2 border rounded-md text-sm"
              />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label
                  for="modal-event-date"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >시작일</label
                >
                <input
                  type="date"
                  id="modal-event-date"
                  class="w-full p-2 border rounded-md text-sm"
                />
              </div>
              <div>
                <label
                  for="modal-event-time"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >시간</label
                >
                <input
                  type="time"
                  id="modal-event-time"
                  value="09:00"
                  class="w-full p-2 border rounded-md text-sm"
                />
              </div>
            </div>
            <div
              id="end-time-container"
              class="hidden grid grid-cols-2 gap-2 pt-2 border-t"
            >
              <div>
                <label
                  for="modal-end-date"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >종료일</label
                >
                <input
                  type="date"
                  id="modal-end-date"
                  class="w-full p-2 border rounded-md text-sm"
                />
              </div>
              <div>
                <label
                  for="modal-end-time"
                  class="block text-sm font-medium text-gray-700 mb-1"
                  >시간</label
                >
                <input
                  type="time"
                  id="modal-end-time"
                  value="10:00"
                  class="w-full p-2 border rounded-md text-sm"
                />
              </div>
            </div>
            <button
              id="add-end-time-btn"
              class="w-full text-sm text-blue-600 hover:underline py-1"
            >
              + 종료일시 추가
            </button>
            <div class="flex justify-end space-x-2 pt-3">
              <button
                id="cancel-edit-btn"
                class="py-2 px-4 rounded-md bg-gray-200 text-gray-800 text-sm font-semibold"
              >
                취소
              </button>
              <button
                id="save-event-btn"
                class="py-2 px-4 rounded-md bg-blue-500 text-white text-sm font-semibold"
              >
                저장
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="daily-events-modal-overlay"
      class="fixed inset-0 bg-black bg-opacity-50 z-[110] hidden"
    ></div>
    <div
      id="daily-events-modal-panel"
      class="fixed inset-0 z-[120] p-4 flex items-center justify-center hidden"
    >
      <div
        class="w-full max-w-sm bg-white rounded-2xl shadow-xl transform transition-all h-[50vh] flex flex-col"
      >
        <div class="p-5 flex-grow flex flex-col min-h-0">
          <div class="flex-shrink-0 flex justify-between items-center mb-4">
            <h3 id="daily-events-modal-title" class="text-lg font-bold"></h3>
            <button
              id="close-daily-events-modal-btn"
              class="text-gray-400 hover:text-gray-700 text-2xl"
            >
              &times;
            </button>
          </div>
          <div id="daily-events-list" class="space-y-2 flex-grow"></div>
        </div>
      </div>
    </div>

    <script type="module" src="js/main.js"></script>
    <script src="js/calendar.js"></script>
  </body>
</html>
