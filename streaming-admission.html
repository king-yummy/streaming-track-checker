<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스밍 입학처 - PLLI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-GYGLSJRN79"
    ></script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9063401338616510"
      crossorigin="anonymous"
    ></script>
    <meta name="google-adsense-account" content="ca-pub-9063401338616510" />

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-GYGLSJRN79");

      function getUserID() {
        let userID = localStorage.getItem("plli_user_id");
        if (!userID) {
          userID = "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(
            /[xy]/g,
            function (c) {
              var r = (Math.random() * 16) | 0,
                v = c == "x" ? r : (r & 0x3) | 0x8;
              return v.toString(16);
            }
          );
          localStorage.setItem("plli_user_id", userID);
        }
        return userID;
      }
    </script>
    <style>
      .step-screen {
        position: absolute;
        inset: 0; /* top:0; right:0; bottom:0; left:0 한 번에 */
        width: 100%;
        transition: opacity 0.25s ease-in-out;
        padding: 1.5rem;
      }

      .step-hidden {
        opacity: 0;
        pointer-events: none;
      }

      #admission-container {
        position: relative;
      }
    </style>
  </head>
  <body class="font-sans bg-gray-50">
    <header class="w-full bg-white shadow-sm sticky top-0 z-10">
      <div
        class="max-w-md mx-auto p-4 relative flex justify-center items-center"
      >
        <button
          id="header-back-button"
          class="absolute left-4 text-gray-600 hover:text-gray-800 hidden"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </button>
        <h2 class="text-xl font-bold">🎓 스밍 입학처</h2>
        <a
          href="index.html"
          class="absolute right-4 text-gray-600 hover:text-gray-800"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </a>
      </div>
      <div class="w-full bg-gray-200 h-1">
        <div
          id="progress-bar"
          class="h-1"
          style="
            background-color: #febfce;
            width: 0%;
            transition: width 0.3s ease-in-out;
          "
        ></div>
      </div>
    </header>

    <main
      id="admission-container"
      class="w-full max-w-md mx-auto p-6 pt-10 bg-white min-h-[calc(100vh-70px)] flex flex-col gap-8 items-stretch text-center overflow-y-auto"
    ></main>

    <a
      href="https://open.kakao.com/o/sSSDWXyh"
      target="_blank"
      class="fixed bottom-6 right-6 bg-yellow-400 text-black font-bold p-3 rounded-full shadow-lg hover:bg-yellow-500 transition z-20"
    >
      <span>help!</span>
    </a>
    <script src="js/admission.js"></script>
  </body>
</html>
