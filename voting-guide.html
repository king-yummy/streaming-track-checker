<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>투표 가이드 - PLLI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* 검색창 X 버튼 숨기기 */
      input[type="search"]::-webkit-search-decoration,
      input[type="search"]::-webkit-search-cancel-button,
      input[type="search"]::-webkit-search-results-button,
      input[type="search"]::-webkit-search-results-decoration {
        display: none;
      }
      /* details summary 기본 화살표 제거 */
      details > summary {
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
    </style>
  </head>
  <body class="font-sans bg-gray-50">
    <header class="w-full bg-white shadow-sm sticky top-0 z-10">
      <div
        class="max-w-xl mx-auto p-4 relative flex justify-center items-center"
      >
        <a
          href="index.html"
          class="absolute left-4 text-gray-600 hover:text-gray-800"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </a>
        <h2 class="text-xl font-bold">🗳️ 투표 가이드</h2>
      </div>
    </header>

    <main class="w-full max-w-xl mx-auto p-4 md:p-6">
      <div class="relative mb-6">
        <input
          type="search"
          id="search-input"
          placeholder="궁금한 앱이나 투표를 검색하세요 (예: 뮤빗)"
          class="w-full p-3 pl-10 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
        <div
          class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
        >
          <svg
            class="h-5 w-5 text-gray-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
      </div>

      <div
        class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm space-y-3 mb-6"
      >
        <div class="flex items-center space-x-2">
          <span class="text-lg">🔐</span>
          <h3 class="text-md font-bold">플리 보조 프로그램 인증 센터</h3>
        </div>

        <p class="text-sm text-gray-700 leading-relaxed">
          플리 보조 프로그램은 관리자 인증 후 사용하실 수 있습니다.<br />
          비밀번호 복사 후 프로그램에 붙여넣기 하세요.
        </p>

        <p class="text-sm text-red-500 leading-relaxed">
          📌 무단 배포 및 악용 의심 계정은 사용이 정지됩니다.
        </p>

        <div class="flex gap-2">
          <input
            id="user-name"
            type="text"
            placeholder="이름을 입력하세요"
            class="flex-1 p-2 border rounded-md text-sm"
          />
          <button
            id="copy-btn"
            onclick="copyPasswordForUser()"
            class="py-2 px-4 rounded-md bg-blue-500 text-white text-sm font-semibold"
          >
            🔑 복사
          </button>
        </div>

        <div id="pw-feedback" class="text-xs pt-1"></div>
      </div>

      <div class="mb-8">
        <h3 class="text-lg font-bold mb-3">💎 앱별 재화 수집 가이드</h3>
        <div id="app-guides-container" class="space-y-3"></div>
      </div>

      <div>
        <h3 class="text-lg font-bold mb-3">📚 투표 가이드 아카이브</h3>
        <div id="vote-guides-container" class="space-y-3"></div>
      </div>
    </main>

    <script src="vote_guide.js"></script>
    <script src="./js/pw.js"></script>
  </body>
</html>
