<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>투표 가이드 - PLLI</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9063401338616510"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      input[type="search"]::-webkit-search-decoration,
      input[type="search"]::-webkit-search-cancel-button,
      input[type="search"]::-webkit-search-results-button,
      input[type="search"]::-webkit-search-results-decoration {
        display: none;
      }
      details > summary {
        list-style: none;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
    </style>
  </head>
  <body class="font-sans bg-gray-50">
    <script>
      // AdSense 설정용: URL에 ?adsense_preview=true가 있으면 숨겨진 광고 컨테이너를 강제로 표시합니다.
      if (
        new URLSearchParams(window.location.search).get("adsense_preview") ===
        "true"
      ) {
        document.addEventListener("DOMContentLoaded", () => {
          const adContainers = document.querySelectorAll(
            'section[id^="ad-container-"]'
          );
          adContainers.forEach((container) => {
            container.style.display = "flex";
          });
        });
      }
    </script>
    <header class="w-full bg-white shadow-sm sticky top-0 z-10">
      <div
        class="max-w-xl mx-auto p-4 relative flex justify-center items-center"
      >
        <a
          href="index.html"
          class="absolute left-4 text-gray-600 hover:text-gray-800"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 19l-7-7 7-7"
            />
          </svg>
        </a>
        <h2 class="text-xl font-bold">🗳️ 투표 가이드</h2>
      </div>
    </header>

    <main class="w-full max-w-xl mx-auto p-4 md:p-6">
      <div class="relative mb-6">
        <input
          type="search"
          id="search-input"
          placeholder="궁금한 앱이나 투표를 검색하세요 (예: 뮤빗)"
          class="w-full p-3 pl-10 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"
        />
        <div
          class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"
        >
          <svg
            class="h-5 w-5 text-gray-400"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
              clip-rule="evenodd"
            />
          </svg>
        </div>
      </div>

      <section
        id="ad-container-1"
        class="my-4 p-4 bg-white rounded-2xl shadow"
        style="
          display: none;
          min-height: 120px;
          max-height: 160px;
          flex-direction: column;
          justify-content: center;
        "
      >
        <h3 class="text-sm font-bold text-gray-400 mb-2 px-2">
          ✨ PLLI를 위한 추천 (서버비에 한 스푼..)
        </h3>
        <div style="text-align: center">
          <ins
            class="adsbygoogle"
            style="display: block"
            data-ad-client="ca-pub-9063401338616510"
            data-ad-slot="광고단위_ID"
            data-ad-format="auto"
            data-full-width-responsive="true"
            data-ad-callback="adCallback"
          ></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
        </div>
      </section>

      <div class="mb-8">
        <h3 class="text-lg font-bold mb-3">💎 앱별 재화 수집 가이드</h3>
        <div id="app-guides-container" class="space-y-3"></div>
      </div>

      <section
        id="ad-container-2"
        class="my-4 p-4 bg-white rounded-2xl shadow"
        style="
          display: none;
          min-height: 120px;
          max-height: 160px;
          flex-direction: column;
          justify-content: center;
        "
      >
        <h3 class="text-sm font-bold text-gray-400 mb-2 px-2">
          ✨ PLLI를 위한 추천 (서버비에 한 스푼..)
        </h3>
        <div style="text-align: center">
          <ins
            class="adsbygoogle"
            style="display: block"
            data-ad-client="ca-pub-9063401338616510"
            data-ad-slot="광고단위_ID"
            data-ad-format="auto"
            data-full-width-responsive="true"
            data-ad-callback="adCallback"
          ></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
        </div>
      </section>

      <div>
        <h3 class="text-lg font-bold mb-3">📚 투표 가이드 아카이브</h3>
        <div id="vote-guides-container" class="space-y-3"></div>
      </div>

      <section
        id="ad-container-3"
        class="my-4 p-4 bg-white rounded-2xl shadow"
        style="
          display: none;
          min-height: 120px;
          max-height: 160px;
          flex-direction: column;
          justify-content: center;
        "
      >
        <h3 class="text-sm font-bold text-gray-400 mb-2 px-2">
          ✨ PLLI를 위한 추천 (서버비에 한 스푼..)
        </h3>
        <div style="text-align: center">
          <ins
            class="adsbygoogle"
            style="display: block"
            data-ad-client="ca-pub-9063401338616510"
            data-ad-slot="광고단위_ID"
            data-ad-format="auto"
            data-full-width-responsive="true"
            data-ad-callback="adCallback"
          ></ins>
          <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
          </script>
        </div>
      </section>
    </main>

    <script src="vote_guide.js"></script>

    <script>
      function adCallback(ad) {
        if (ad.is_empty) {
          return;
        }
        const adContainer = ad.el.closest('section[id^="ad-container-"]');
        if (adContainer) {
          adContainer.style.display = "flex";
        }
      }
    </script>
  </body>
</html>
