    <script src="vote_guide.js"></script>

    <script>
      function revealAdWhenFilled(containerId) {
        const box = document.getElementById(containerId);
        if (!box) return;
        const tick = setInterval(() => {
          const isFilled = box.querySelector(
            'ins.adsbygoogle[data-ad-status="filled"]'
          );
          const hasIframe = box.querySelector("ins.adsbygoogle iframe");
          if (isFilled || hasIframe) {
            box.style.display = "flex";
            clearInterval(tick);
          }
        }, 300);
        setTimeout(() => clearInterval(tick), 10000);
      }
      document.addEventListener("DOMContentLoaded", () => {
        revealAdWhenFilled("ad-container-1");
        revealAdWhenFilled("ad-container-2");
        revealAdWhenFilled("ad-container-3");
      });
    </script>
